name: harmonia
x-app: &app
  build: .
  image: harmonia:local
  init: true
  env_file: ${HARMONIA_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql+psycopg://harmonia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/harmonia
    REDIS_URL: redis://redis:6379/0
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: harmonia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: harmonia
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U harmonia -d harmonia]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
    healthcheck:
      disable: true
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *app
    command: [playlist-worker]
    healthcheck:
      test: [CMD, playlist-worker, --check]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
