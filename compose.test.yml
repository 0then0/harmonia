# Disposable test services; no persistent volumes and no public ports.
services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: harmonia_test
      POSTGRES_PASSWORD: disposable_test_password
      POSTGRES_DB: harmonia_test
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U harmonia_test -d harmonia_test]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
